[project]
name = "adversarial-experiments"
version = "0.1.0"
description = "ISEF Adversarial Robustness via Collision Geometry - Directional Collision Principle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Data analysis
    "pandas>=2.0.0",
    "numpy>=1.24.0,<2",
    "scipy>=1.11.0",

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",

    # Machine learning
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",

    # Tokenization (for OpenAI sparse circuits)
    "tiktoken>=0.5.0",
]

# Optional: OpenAI's circuit_sparsity library (install separately)
# git clone https://github.com/openai/circuit_sparsity
# pip install -e circuit_sparsity/

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
